<style>
  /* viewer chrome (page shell only; the plan widget is styled by pgplan.css).
     Palette and fonts follow the pg_diag report theme; dark is the default
     scheme, like in the report. */
  :root {
    color-scheme: dark; /* native controls & scrollbars follow the theme */
    --vw-bg: #17111f;
    --vw-panel: #241a2d;
    --vw-input-bg: #1d1526;
    --vw-fg: #f8f0ff;
    --vw-muted: #d8c8e8;
    --vw-border: #463456;
    --vw-border-strong: #725a87;
    --vw-accent: #f3d46b;
    --vw-accent-contrast: #24152f;
    --vw-button-bg: #2b2035;
    --vw-button-hover: #392847;
    --vw-err-bg: #3f1717;
    --vw-err-fg: #ffb4b4;
    --vw-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-pv-theme="light"] {
    color-scheme: light;
    --vw-bg: #fbf7ff;
    --vw-panel: #ffffff;
    --vw-input-bg: #fffdf7;
    --vw-fg: #2b1d38;
    --vw-muted: #746286;
    --vw-border: #dfd2ec;
    --vw-border-strong: #c9b3df;
    --vw-accent: #f4cf6a;
    --vw-accent-contrast: #2a1738;
    --vw-button-bg: #fffaf0;
    --vw-button-hover: #f6ecff;
    --vw-err-bg: #fee2e2;
    --vw-err-fg: #991b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--vw-bg);
    color: var(--vw-fg);
    font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* slim themed scrollbars everywhere (textareas, page, widget panes) */
  * { scrollbar-width: thin; scrollbar-color: var(--vw-border-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--vw-border-strong);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--vw-accent); background-clip: padding-box; }
  *::-webkit-scrollbar-corner { background: transparent; }
  .vw-wrap { max-width: 1700px; margin: 0 auto; padding: 18px 24px 48px; }
  .vw-top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .vw-title { font-size: 20px; font-weight: 600; margin: 0; }
  .vw-title small { color: var(--vw-muted); font-weight: 400; margin-left: 10px; font-size: 14px; }
  .vw-top .spacer { flex: 1; }
  /* project identity, laid out like the pg_diag report header */
  .vw-ident { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 6px; }
  .vw-ident, .vw-ident a {
    color: var(--vw-muted);
    font-family: var(--vw-mono);
    font-size: 13px;
    text-decoration: none;
  }
  .vw-link { display: inline-flex; align-items: center; gap: 5px; }
  .vw-link:hover, .vw-link:focus-visible { color: var(--vw-fg); text-decoration: underline; outline: none; }
  .vw-link svg {
    width: 14px; height: 14px; flex: 0 0 auto;
    stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* The form is moved into the widget's first tab after the first render,
     where the widget resets bare buttons (`.pv :where(button)`). These
     styles must therefore name the page's own controls by class — an
     ancestor selector like `.vw-wrap button` would also match the widget's
     tabs and copy buttons, which live inside the page too. */
  .vw-input .vw-btn {
    font: inherit;
    color: var(--vw-fg);
    background: var(--vw-button-bg);
    border: 1px solid var(--vw-border);
    border-radius: 10px;
    padding: 6px 13px;
    line-height: normal;
    margin: 0;
  }
  .vw-input .vw-btn { cursor: pointer; }
  .vw-input .vw-btn:hover {
    background: var(--vw-button-hover);
    border-color: var(--vw-border-strong);
  }
  .vw-input .vw-btn.primary {
    background: var(--vw-accent);
    color: var(--vw-accent-contrast);
    border-color: var(--vw-accent);
    font-weight: 600;
  }
  .vw-input .vw-btn.primary:hover { filter: brightness(1.06); }
  /* Export sits in the widget's tab bar, so it is styled to match a tab
     rather than the page's own buttons */
  .vw-export {
    font: inherit;
    font-size: var(--pv-fs, 14px);
    color: var(--pv-fg-muted, var(--vw-muted));
    background: none;
    border: 1px solid var(--pv-border, var(--vw-border));
    border-radius: 999px;
    padding: 6px 15px;
    cursor: pointer;
  }
  .vw-export:hover:enabled {
    color: var(--pv-fg, var(--vw-fg));
    border-color: var(--pv-border-strong, var(--vw-border-strong));
  }
  .vw-export:disabled { opacity: 0.5; cursor: default; }
  .vw-input { margin-top: 14px; }
  .vw-input textarea {
    width: 100%;
    height: 340px;
    min-height: 220px; /* fixed floor: never collapses below a readable size */
    resize: vertical;
    font-family: var(--vw-mono);
    font-size: 13px;
    line-height: 1.5;
    color: var(--vw-fg);
    background: var(--vw-input-bg);
    border: 1px solid var(--vw-border);
    border-radius: 10px;
    padding: 10px 13px;
  }
  .vw-input textarea:focus { outline: none; border-color: var(--vw-accent); }
  .vw-input textarea.vw-sql { height: 130px; min-height: 90px; margin-top: 8px; }

  /* theme switch — same control as the pg_diag report header */
  .vw-theme-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    border: 1px solid var(--vw-border);
    border-radius: 10px;
    background: var(--vw-button-bg);
    color: var(--vw-muted);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .vw-theme-toggle input {
    appearance: none;
    position: relative;
    width: 42px;
    height: 22px;
    margin: 0;
    border: 1px solid var(--vw-border-strong);
    border-radius: 999px;
    background: var(--vw-input-bg);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .vw-theme-toggle input::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--vw-muted);
    transition: transform 120ms ease, background 120ms ease;
  }
  .vw-theme-toggle input:checked {
    border-color: var(--vw-accent);
    background: var(--vw-accent);
  }
  .vw-theme-toggle input:checked::before {
    transform: translateX(20px);
    background: var(--vw-accent-contrast);
  }
  .vw-bar { display: flex; gap: 10px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .vw-hint { color: var(--vw-muted); font-size: 14px; }
  .vw-hint code {
    font-family: var(--pv-font-mono, ui-monospace, monospace);
    border: 1px solid var(--vw-border); border-radius: 4px; padding: 0 4px;
  }
  .vw-error {
    margin-top: 12px;
    padding: 10px 14px;
    border: 1px solid var(--vw-border-strong);
    border-radius: 10px;
    color: var(--vw-err-fg);
    background: var(--vw-err-bg);
    font-family: var(--vw-mono);
    font-size: 13px;
    white-space: pre-wrap;
    display: none;
  }
  .vw-out {
    margin-top: 18px;
    background: var(--vw-panel);
    border: 1px solid var(--vw-border);
    border-radius: 12px;
    padding: 12px 18px 20px;
    display: none;
  }
  .vw-out .pv { background: transparent; }
</style>
</head>

  <div class="vw-input" id="inputbox">
    <textarea id="src" spellcheck="false"
      placeholder="Paste an EXPLAIN ANALYZE plan here — text, JSON or YAML format; auto_explain log entries (&quot;duration: … ms  plan:&quot; with Query Text) are understood too."></textarea>
    <textarea id="sql" class="vw-sql" spellcheck="false"
      placeholder="Optional: the SQL query text — used when the plan carries no Query Text (overrides it otherwise). One statement, matched against the plan: what it adds — which FROM item a node came from, parameter vs literal, who wrote a cast — is dropped when the two do not match."></textarea>
    <div class="vw-bar">
      <button class="primary vw-btn" id="go">Visualize</button>
      <button class="vw-btn" id="clear">Clear</button>
      <span class="vw-hint">Ctrl+Enter — visualize · click a row — expand node details · click a column header — jump to the hottest node · <code>sql</code> on a recommendation — show the query fragment it came from</span>
    </div>
    <div class="vw-error" id="error"></div>
  </div>

  <div class="vw-out" id="out"><div id="planview"></div></div>
</div>

<script src="vendor/highlight-11.11.1.min.js"></script><!--PV:JS-HLJS-->
<script src="src/pgplan-expr.js"></script><!--PV:JS-EXPR-->
<script src="src/pgplan-sql.js"></script><!--PV:JS-SQL-->
<script src="src/pgplan.js"></script><!--PV:JS-CORE-->
<script src="src/pgplan-render.js"></script><!--PV:JS-RENDER-->
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const srcEl = $('src'), sqlEl = $('sql'), errEl = $('error'), outEl = $('out');
  // The input block moves into the widget's first tab once a plan is shown.
  // Remember where it belongs so it can come back when there is no widget.
  const inputBox = $('inputbox');
  const inputHome = inputBox.parentNode, inputAfter = inputBox.nextSibling;
  const restoreInput = () => inputHome.insertBefore(inputBox, inputAfter);

  /* theme — dark by default, like the pg_diag report */
  const applyTheme = t => {
    document.documentElement.setAttribute('data-pv-theme', t === 'light' ? 'light' : 'dark');
  };
  let theme = 'dark';
  try { theme = localStorage.getItem('pv-theme') || 'dark'; } catch (e) {}
  applyTheme(theme);
  const themeEl = $('theme');
  themeEl.checked = theme === 'light'; // checked = light, like the report
  themeEl.addEventListener('change', () => {
    theme = themeEl.checked ? 'light' : 'dark';
    try { localStorage.setItem('pv-theme', theme); } catch (e) {}
    applyTheme(theme);
    if (lastPlan) show(lastPlan); // re-render so heat colors pick up theme hues
  });

  let lastPlan = null;
  let frozen = false;   // an exported copy is a snapshot, not a workbench

  /* ---- export: the page clones itself with the input baked in ----------
     Only the data goes into the copy; every tab is recomputed on open by
     the same code that is already inlined here. That keeps the file small
     relative to what it shows, and makes it a frozen snapshot of both the
     input and the analysis.
     Captured before anything renders: after that the DOM holds the widget
     and the input form has moved into it. */
  const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
  const SELF_CONTAINED = !/<link[^>]+rel=["']?stylesheet|<script[^>]+src=/i.test(PRISTINE);
  const EXPORT_ID = 'pv-export-data';

  const exportBtn = document.createElement('button');
  exportBtn.type = 'button';
  exportBtn.className = 'vw-export';
  exportBtn.textContent = 'Export';
  if (!SELF_CONTAINED) {
    exportBtn.disabled = true;
    exportBtn.title = 'Export needs the built page (python3 build.py): a page that '
      + 'links its styles and scripts cannot put them into the copy.';
  } else {
    exportBtn.title = 'Save a self-contained copy of this page with the plan and query '
      + 'baked in. The file carries your pasted data.';
  }

  exportBtn.addEventListener('click', () => {
    if (!lastPlan || !SELF_CONTAINED) return;
    // frozen: the copy shows the analysis, it is not a place to type in.
    // The boot below makes the fields read-only and drops this very button.
    const data = JSON.stringify({ plan: srcEl.value, sql: sqlEl.value, theme, frozen: true });
    // the payload rides in a JSON island: no markup, and "<" is escaped so
    // nothing in a plan or query can close the tag or open another
    const island = '<script id="' + EXPORT_ID + '" type="application/json">'
      + data.replace(/</g, '\\u003c') + '<\/script>\n';
    // Spliced by index, not by replace(): the closing body tag also appears
    // as a literal inside this very script, so a regex would match that one
    // first, and the island's own closing script tag would then terminate
    // the page's script there. Index splicing also keeps "$1" or "$&" in a
    // plan from being read as replacement patterns.
    // (Nothing here may spell a closing script tag literally — even inside a
    //  comment it ends the inline script; build.py checks for that.)
    const BODY_END = '<' + '/body>';
    const at = PRISTINE.lastIndexOf(BODY_END);
    const html = at < 0 ? PRISTINE + island
      : PRISTINE.slice(0, at) + island + PRISTINE.slice(at);
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pg-explain-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  });

  function show(plan) {
    outEl.style.display = 'block';
    exportBtn.disabled = !SELF_CONTAINED;
    PgPlanRender.render($('planview'), plan, {
      inputPane: inputBox,
      tabActions: frozen ? null : exportBtn,
    });
  }

  function freeze() {
    frozen = true;
    for (const t of [srcEl, sqlEl]) {
      t.readOnly = true;
      t.setAttribute('aria-readonly', 'true');
    }
    // nothing here acts on the data any more, so the controls go rather than
    // sit greyed out
    for (const id of ['go', 'clear']) { const b = $(id); if (b) b.remove(); }
    // placeholders instruct; a snapshot has nothing to instruct about, and an
    // empty field carries no data worth showing
    for (const t of [srcEl, sqlEl]) {
      t.removeAttribute('placeholder');
      if (!t.value.trim()) t.hidden = true;
    }
    const hint = document.querySelector('.vw-hint');
    if (hint) {
      hint.textContent = 'Exported snapshot — the plan and query above are the ones it was '
        + 'built from and cannot be edited here. Open the viewer itself to analyze another plan.';
    }
  }

  function visualize(scrollToResult) {
    const input = srcEl.value;
    errEl.style.display = 'none';
    if (!input.trim()) return;
    try {
      lastPlan = PgPlan.parse(input, { query: sqlEl.value });
      show(lastPlan);
      if (scrollToResult) outEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      lastPlan = null;
      // the failed render must not take the input form down with it
      restoreInput();
      outEl.style.display = 'none';
      errEl.textContent = 'Parse error: ' + e.message;
      errEl.style.display = 'block';
    }
  }

  $('go').addEventListener('click', () => visualize(true));
  $('clear').addEventListener('click', () => {
    srcEl.value = ''; sqlEl.value = '';
    lastPlan = null; // a later theme switch must not resurrect the old plan
    restoreInput();
    outEl.style.display = 'none';
    errEl.style.display = 'none';
    srcEl.focus();
  });
  for (const t of [srcEl, sqlEl]) {
    t.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') visualize(true);
    });
  }

  /* An exported copy carries its input in a JSON island. The island is
     written just before </body>, so it is parsed after this script — wait
     for the document rather than looking for it now. */
  function boot() {
    const island = $(EXPORT_ID);
    if (!island) return;
    try {
      const data = JSON.parse(island.textContent);
      srcEl.value = data.plan || '';
      sqlEl.value = data.sql || '';
      // after the values land: freeze() hides fields that carry no data
      if (data.frozen) freeze();
      if (data.theme) {
        theme = data.theme;
        themeEl.checked = theme === 'light';
        applyTheme(theme);
      }
      visualize(false);
    } catch (e) {
      errEl.textContent = 'This exported file carries data this page cannot read: ' + e.message;
      errEl.style.display = 'block';
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>
</body>
</html>
